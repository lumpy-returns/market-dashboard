name: Refresh Market Data

on:
  schedule:
    # Runs weekdays at 22:00 UTC (~6am HKT / 2pm PT), after US markets close.
    # Edit this cron expression to change the schedule: https://crontab.guru
    - cron: '0 22 * * 1-5'
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

permissions:
  contents: write   # needed so the workflow can commit the updated JSON back to the repo

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install yfinance

      - name: Run fetch script
        run: python fetch_data.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/market_data.json
          git diff --staged --quiet || git commit -m "Auto-refresh market data"
          git push
