<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Market Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #ffffff;
    --panel: #ffffff;
    --panel-hover: #f2f1ec;
    --border: #dcd7cc;
    --text: #1a1a1a;
    --muted: #6b6660;
    --up: #1f7a4c;
    --down: #a4302a;
    --neutral-dot: #b8860b;
    --accent: #1d3f6e;
    --dot-green: #2e8b57;
    --dot-red: #c0392b;
    --dot-yellow: #d4a017;
    --dot-grey: #9a958c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: Cambria, Garamond, "EB Garamond", Georgia, serif;
    font-variant-numeric: lining-nums tabular-nums;
    padding: 24px;
    max-width: 1200px;
    margin: 0 auto;
  }
  header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    border-bottom: 1px solid var(--border);
    padding-bottom: 16px;
    margin-bottom: 16px;
  }
  h1 { font-size: 20px; letter-spacing: 1px; margin: 0; }
  #last-updated { color: var(--muted); font-size: 12px; }
  #status { color: var(--muted); font-size: 13px; padding: 24px 0; }

  .view-toggle { display: flex; gap: 8px; margin-bottom: 24px; }
  .view-toggle button {
    padding: 10px 20px;
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--muted);
    font-family: inherit;
    font-size: 12px;
    letter-spacing: 0.5px;
    cursor: pointer;
  }
  .view-toggle button.active { color: var(--accent); border-color: var(--accent); }

  .section { margin-top: 40px; }
  .section-head { display: flex; align-items: baseline; gap: 12px; margin-bottom: 4px; }
  .section-num { color: var(--accent); font-size: 13px; font-weight: bold; }
  .section-title { font-size: 16px; margin: 0; }
  .section-sub { color: var(--muted); font-size: 11px; letter-spacing: 0.5px; margin: 0 0 16px 0; }
  .subtable-label { color: var(--accent); font-size: 12px; margin: 24px 0 8px 0; }

  table { width: 100%; table-layout: fixed; border-collapse: collapse; background: var(--panel); border: 1px solid var(--border); }
  th, td {
    padding: 9px 12px;
    text-align: right;
    font-size: 12.5px;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  th:first-child, td:first-child { text-align: left; }
  td:first-child { color: var(--text); }
  tr.has-holdings td:first-child { cursor: pointer; }
  tr.has-holdings td:first-child:hover { color: var(--accent); }
  th {
    color: var(--muted);
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    font-weight: normal;
    cursor: pointer;
    user-select: none;
  }
  th.sortable:hover { color: var(--accent); }
  th .sort-arrow { font-size: 9px; margin-left: 3px; color: var(--accent); }
  tr:last-child td { border-bottom: none; }
  .up { color: var(--up); }
  .down { color: var(--down); }
  .neutral { color: var(--muted); }
  .holdings-row { display: none; }
  .holdings-row.open { display: table-row; }
  .holdings-row td { background: var(--panel-hover); text-align: left; color: var(--muted); font-size: 11.5px; padding: 8px 12px; }
  .chip { display: inline-block; border: 1px solid var(--border); border-radius: 3px; padding: 2px 7px; margin-right: 6px; color: var(--text); }

  .breadth-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
  .breadth-card { background: var(--panel); border: 1px solid var(--border); padding: 16px; }
  .breadth-card .label { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; }
  .breadth-card .value { font-size: 22px; margin-top: 6px; }

  /* Traffic light dots */
  .dot { display: inline-block; width: 16px; height: 16px; border-radius: 50%; }
  .dot-green { background: var(--dot-green); }
  .dot-red { background: var(--dot-red); }
  .dot-yellow { background: var(--dot-yellow); }
  .dot-grey { background: var(--dot-grey); }
  th.center-cell, td.center-cell { text-align: center; }

  .ticker-link { color: inherit; text-decoration: none; border-bottom: 1px solid var(--border); }
  .ticker-link:hover { color: var(--accent); border-bottom-color: var(--accent); }
</style>
</head>
<body>

<header>
  <h1>Market Dashboard</h1>
  <div id="last-updated">Loading...</div>
</header>

<div class="view-toggle">
  <button id="view-btn-performance" onclick="setView('performance')">Performance</button>
  <button id="view-btn-traffic" class="active" onclick="setView('traffic')">Traffic Light</button>
  <button id="filter-btn-green" onclick="toggleGreenFilter()">Uptrends Only</button>
</div>

<div id="status">Fetching data/market_data.json ...</div>
<div id="app" style="display:none;"></div>

<script>
// ---------------------------------------------------------------------
// Global state
// ---------------------------------------------------------------------
let DATA = null;
let currentView = 'traffic';
let showOnlyGreen = false;
// per-table sort state, keyed by table id: { field, direction }
const sortState = {};
let tableCounter = 0;

// ---------------------------------------------------------------------
// Formatting helpers
// ---------------------------------------------------------------------
function fmtPct(val) {
  if (val === null || val === undefined) return '<span class="neutral">—</span>';
  const cls = val > 0 ? 'up' : (val < 0 ? 'down' : 'neutral');
  const sign = val > 0 ? '+' : '';
  return `<span class="${cls}">${sign}${val.toFixed(2)}%</span>`;
}
function fmtBps(val) {
  if (val === null || val === undefined) return '<span class="neutral">—</span>';
  const cls = val > 0 ? 'up' : (val < 0 ? 'down' : 'neutral');
  const sign = val > 0 ? '+' : '';
  return `<span class="${cls}">${sign}${val.toFixed(1)}bp</span>`;
}
function fmtPrice(val, decimals) {
  if (val === null || val === undefined) return '—';
  return val.toLocaleString(undefined, { minimumFractionDigits: decimals ?? 2, maximumFractionDigits: decimals ?? 2 });
}
function sparklineSvg(values) {
  if (!values || values.length < 2) return '';
  const w = 60, h = 20, pad = 2;
  const min = Math.min(...values), max = Math.max(...values);
  const range = (max - min) || 1;
  const pts = values.map((v, i) => {
    const x = pad + (i / (values.length - 1)) * (w - pad * 2);
    const y = h - pad - ((v - min) / range) * (h - pad * 2);
    return `${x.toFixed(1)},${y.toFixed(1)}`;
  }).join(' ');
  const trendUp = values[values.length - 1] >= values[0];
  const color = trendUp ? 'var(--up)' : 'var(--down)';
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><polyline points="${pts}" fill="none" stroke="${color}" stroke-width="1.5"/></svg>`;
}
function dot(colorWord) {
  return `<span class="dot dot-${colorWord}"></span>`;
}
function tickerUrl(ticker, linkType) {
  const encoded = encodeURIComponent(ticker);
  // ETFs have a "holdings" tab on Yahoo Finance; indices, futures, crypto and
  // treasury yields are not funds and don't, so they link to the plain quote
  // page instead.
  return linkType === 'holdings'
    ? `https://finance.yahoo.com/quote/${encoded}/holdings/`
    : `https://finance.yahoo.com/quote/${encoded}/`;
}
function boolDot(val, falseColor) {
  return dot(val ? 'green' : (falseColor || 'grey'));
}

// ---------------------------------------------------------------------
// Generic sortable table
// ---------------------------------------------------------------------
// columns: [{ label, field, type: 'text'|'num'|'bool'|'sparkline'|'dot', sortable }]
const tableRegistry = {}; // tableId -> { rows, columns, nameLabel }

function compareValues(a, b, type) {
  if (type === 'bool') { a = a ? 1 : 0; b = b ? 1 : 0; }
  if (a === null || a === undefined) return 1;
  if (b === null || b === undefined) return -1;
  if (typeof a === 'string') return a.localeCompare(b);
  return a - b;
}

function renderTable(tableId) {
  const { rows, columns, linkType } = tableRegistry[tableId];
  const state = sortState[tableId] || { field: null, direction: 'desc' };

  let sortedRows = rows;
  if (state.field) {
    const col = columns.find(c => c.field === state.field);
    sortedRows = [...rows].sort((a, b) => {
      const cmp = compareValues(a[state.field], b[state.field], col.type);
      return state.direction === 'asc' ? cmp : -cmp;
    });
  }

  // Fixed column widths (via colgroup) so tables with the same column set
  // line up with each other regardless of how long any one table's longest
  // instrument name happens to be -- otherwise each table auto-sizes its
  // own "Instrument" column independently and the dot/data columns drift
  // out of alignment from section to section.
  const COLUMN_WIDTH = { text: 240, price: 90, pct: 80, bps: 90, sparkline: 90, dot: 130, bool: 150 };
  let html = `<table id="${tableId}"><colgroup>`;
  columns.forEach(col => {
    html += `<col style="width:${COLUMN_WIDTH[col.type] || 90}px">`;
  });
  html += '</colgroup><thead><tr>';
  columns.forEach(col => {
    const isSorted = state.field === col.field;
    const arrow = isSorted ? `<span class="sort-arrow">${state.direction === 'asc' ? '▲' : '▼'}</span>` : '';
    const sortCls = col.sortable !== false ? 'sortable' : '';
    const alignCls = (col.type === 'dot' || col.type === 'bool' || col.type === 'sparkline') ? 'center-cell' : '';
    const onclick = col.sortable !== false ? `onclick="handleSort('${tableId}','${col.field}')"` : '';
    html += `<th class="${sortCls} ${alignCls}" ${onclick}>${col.label}${arrow}</th>`;
  });
  html += '</tr></thead><tbody>';

  sortedRows.forEach(r => {
    const hasHoldings = r.top_holdings && r.top_holdings.length > 0;
    const rowId = `hold-${tableCounter++}`;
    html += `<tr class="${hasHoldings ? 'has-holdings' : ''}" ${hasHoldings ? `onclick="toggleHoldings('${rowId}')"` : ''}>`;
    columns.forEach(col => {
      if (col.field === 'name') {
        const url = tickerUrl(r.ticker, linkType);
        html += `<td><a class="ticker-link" href="${url}" target="_blank" rel="noopener noreferrer">${r.name}</a> <span class="neutral">(${r.ticker})</span>${hasHoldings ? ' ▸' : ''}</td>`;
      } else if (col.type === 'sparkline') {
        html += `<td class="center-cell">${sparklineSvg(r[col.field])}</td>`;
      } else if (col.type === 'dot') {
        html += `<td class="center-cell">${dot(r[col.field])}</td>`;
      } else if (col.type === 'bool') {
        html += `<td class="center-cell">${boolDot(r[col.field], col.falseColor)}</td>`;
      } else if (col.type === 'price') {
        html += `<td>${fmtPrice(r[col.field], col.decimals)}</td>`;
      } else if (col.type === 'bps') {
        html += `<td>${fmtBps(r[col.field])}</td>`;
      } else {
        html += `<td>${fmtPct(r[col.field])}</td>`;
      }
    });
    html += '</tr>';
    if (hasHoldings) {
      html += `<tr class="holdings-row" id="${rowId}"><td colspan="${columns.length}">
        Top holdings: ${r.top_holdings.map(h => `<span class="chip">${h}</span>`).join('')}
      </td></tr>`;
    }
  });

  html += '</tbody></table>';
  return html;
}

function handleSort(tableId, field) {
  const current = sortState[tableId] || { field: null, direction: 'desc' };
  if (current.field === field) {
    sortState[tableId] = { field, direction: current.direction === 'desc' ? 'asc' : 'desc' };
  } else {
    sortState[tableId] = { field, direction: 'desc' };
  }
  const el = document.getElementById(tableId);
  el.outerHTML = renderTable(tableId);
}

function toggleHoldings(rowId) {
  const row = document.getElementById(rowId);
  if (row) row.classList.toggle('open');
}

function makeTable(rows, columns, linkType) {
  const tableId = `tbl-${tableCounter++}`;
  tableRegistry[tableId] = { rows, columns, linkType: linkType || 'quote' };
  return `<div style="overflow-x:auto;">${renderTable(tableId)}</div>`;
}

function filterRows(rows) {
  return showOnlyGreen ? rows.filter(r => r.trend === 'green') : rows;
}

function emptyFilterMessage() {
  return `<p class="section-sub" style="margin-top:16px;">No instruments currently in an uptrend in this section.</p>`;
}

function toggleGreenFilter() {
  showOnlyGreen = !showOnlyGreen;
  document.getElementById('filter-btn-green').classList.toggle('active', showOnlyGreen);
  renderApp();
}

// ---------------------------------------------------------------------
// Column definitions
// ---------------------------------------------------------------------
function performanceColumns(yieldMode) {
  return [
    { label: 'Instrument', field: 'name', type: 'text', sortable: false },
    { label: 'Price', field: 'price', type: 'price' },
    { label: yieldMode ? '1D (bps)' : '1D %', field: yieldMode ? 'chg_1d_bps' : 'chg_1d_pct', type: yieldMode ? 'bps' : 'pct' },
    { label: '1W %', field: 'chg_1w_pct', type: 'pct' },
    { label: '1M %', field: 'chg_1m_pct', type: 'pct' },
    { label: '3M %', field: 'chg_3m_pct', type: 'pct' },
    { label: '1Y %', field: 'chg_1y_pct', type: 'pct' },
    { label: '52W Hi %', field: 'pct_from_52w_high', type: 'pct' },
  ];
}

const trafficColumns = [
  { label: 'Instrument', field: 'name', type: 'text', sortable: false },
  { label: 'Trend', field: 'trend', type: 'dot' },
  { label: '10 EMA vs 20 EMA', field: 'cond_10_gt_20', type: 'bool', falseColor: 'red' },
  { label: 'Low > 20 EMA', field: 'cond_low_gt_20', type: 'bool' },
  { label: 'Low > 10 EMA', field: 'cond_low_gt_10', type: 'bool' },
  { label: '5D', field: 'sparkline', type: 'sparkline', sortable: false },
  { label: '20D', field: 'sparkline_20d', type: 'sparkline', sortable: false },
];

// ---------------------------------------------------------------------
// Section builders
// ---------------------------------------------------------------------
const MACRO_GROUPS = [
  // US Index Futures -- disabled for now, may reuse this section later.
  // ['us_index_futures', 'US Index Futures'],
  ['global_indices', 'Global Market Indices'],
  ['yields', 'US Treasury Yields'],
  ['energy', 'Oil and Gas'],
  ['vol_dollar', 'Volatility & Dollar'],
  ['metals', 'Precious & Base Metals'],
  ['crypto', 'Crypto'],
];
const EQUITIES_GROUPS = [
  ['major_etfs', 'Major ETF Stats'],
  ['sp500_submarket', 'S&P 500 Sub-Market — Style Factors'],
  ['sectors', 'S&P 500 Sectors'],
  ['sectors_ew', 'S&P 500 Equal-Weight Sectors'],
  ['themes', 'Top Thematic ETFs'],
  ['countries_developed', 'Country ETFs — Developed'],
  ['countries_emerging', 'Country ETFs — Emerging'],
];

function buildPerformanceView(data) {
  let html = `<div class="section">
    <div class="section-head"><span class="section-num">01</span><h2 class="section-title">Macro Overview</h2></div>
    <p class="section-sub">EOD SNAPSHOT · CLICK ANY COLUMN HEADER TO SORT</p>`;
  let macroShown = 0;
  MACRO_GROUPS.forEach(([key, label]) => {
    const rows = filterRows((data.macro || {})[key] || []);
    if (rows.length === 0) return;
    macroShown++;
    html += `<div class="subtable-label">▸ ${label}</div>`;
    html += makeTable(rows, performanceColumns(key === 'yields'), 'quote');
  });
  if (macroShown === 0) html += emptyFilterMessage();
  html += '</div>';

  html += `<div class="section">
    <div class="section-head"><span class="section-num">02</span><h2 class="section-title">Equities Overview</h2></div>
    <p class="section-sub">CLICK ANY COLUMN HEADER TO SORT</p>`;
  let equitiesShown = 0;
  EQUITIES_GROUPS.forEach(([key, label]) => {
    const rows = filterRows((data.equities || {})[key] || []);
    if (rows.length === 0) return;
    equitiesShown++;
    html += `<div class="subtable-label">▸ ${label}</div>`;
    html += makeTable(rows, performanceColumns(false), 'holdings');
  });
  if (equitiesShown === 0) html += emptyFilterMessage();
  html += '</div>';

  const breadth = data.breadth || {};
  const cards = [
    ['1D Breadth (% Positive)', breadth.pct_positive_1d != null ? breadth.pct_positive_1d.toFixed(1) + '%' : '—'],
    ['1W Breadth (% Positive)', breadth.pct_positive_1w != null ? breadth.pct_positive_1w.toFixed(1) + '%' : '—'],
    ['VIX Level', breadth.vix_level != null ? breadth.vix_level.toFixed(2) : '—'],
    ['Sentiment', breadth.sentiment_label || '—'],
    ['Tracked Instruments', breadth.tracked_instruments ?? '—'],
  ];
  html += `<div class="section">
    <div class="section-head"><span class="section-num">03</span><h2 class="section-title">Market Breadth &amp; Sentiment</h2></div>
    <p class="section-sub">DERIVED FROM TRACKED ETF/SECTOR UNIVERSE · NOT A FULL NYSE ADVANCE/DECLINE LINE</p>
    <div class="breadth-cards">`;
  cards.forEach(([label, value]) => {
    html += `<div class="breadth-card"><div class="label">${label}</div><div class="value">${value}</div></div>`;
  });
  html += '</div></div>';

  return html;
}

function buildTrafficView(data) {
  let html = `<div class="section">
    <div class="section-head"><span class="section-num">01</span><h2 class="section-title">Macro — Trend Signals</h2></div>
    <p class="section-sub">GREEN: 10EMA&gt;20EMA &amp; LOW&gt;20EMA · RED: 10EMA&gt;20EMA &amp; HIGH&lt;20EMA · ELSE YELLOW</p>`;
  let macroShown = 0;
  MACRO_GROUPS.forEach(([key, label]) => {
    const rows = filterRows((data.macro || {})[key] || []);
    if (rows.length === 0) return;
    macroShown++;
    html += `<div class="subtable-label">▸ ${label}</div>`;
    html += makeTable(rows, trafficColumns, 'quote');
  });
  if (macroShown === 0) html += emptyFilterMessage();
  html += '</div>';

  html += `<div class="section">
    <div class="section-head"><span class="section-num">02</span><h2 class="section-title">Equities — Trend Signals</h2></div>
    <p class="section-sub">CLICK ANY COLUMN HEADER TO SORT</p>`;
  let equitiesShown = 0;
  EQUITIES_GROUPS.forEach(([key, label]) => {
    const rows = filterRows((data.equities || {})[key] || []);
    if (rows.length === 0) return;
    equitiesShown++;
    html += `<div class="subtable-label">▸ ${label}</div>`;
    html += makeTable(rows, trafficColumns, 'holdings');
  });
  if (equitiesShown === 0) html += emptyFilterMessage();
  html += '</div>';

  return html;
}

function setView(view) {
  currentView = view;
  document.getElementById('view-btn-performance').classList.toggle('active', view === 'performance');
  document.getElementById('view-btn-traffic').classList.toggle('active', view === 'traffic');
  renderApp();
}

function renderApp() {
  if (!DATA) return;
  // reset per-render state so table ids/sort don't collide across views
  Object.keys(tableRegistry).forEach(k => delete tableRegistry[k]);
  Object.keys(sortState).forEach(k => delete sortState[k]);
  tableCounter = 0;

  const appEl = document.getElementById('app');
  appEl.innerHTML = currentView === 'performance' ? buildPerformanceView(DATA) : buildTrafficView(DATA);
}

// ---------------------------------------------------------------------
// Boot
// ---------------------------------------------------------------------
async function loadData() {
  const statusEl = document.getElementById('status');
  const appEl = document.getElementById('app');
  const updatedEl = document.getElementById('last-updated');

  try {
    const res = await fetch(`data/market_data.json?t=${Date.now()}`);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    DATA = data;

    if (data.last_updated_utc) {
      const updated = new Date(data.last_updated_utc);
      const formatted = updated.toLocaleString('en-US', {
        timeZone: 'America/Los_Angeles',
        dateStyle: 'medium',
        timeStyle: 'short',
      });
      updatedEl.textContent = `Last updated: ${formatted} PT`;
    } else {
      updatedEl.textContent = 'No data yet — run the GitHub Action once';
    }

    renderApp();
    statusEl.style.display = 'none';
    appEl.style.display = 'block';
  } catch (err) {
    statusEl.textContent = `Could not load market data: ${err.message}. ` +
      `If this is a fresh repo, run the GitHub Action once to generate data/market_data.json.`;
  }
}

loadData();
</script>

</body>
</html>
